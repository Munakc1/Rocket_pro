name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle-size budget
        run: npx lacspace-size@0.2.0 frontend/.next/static --metric gzip --max 500kb
      - name: Dependency audit
        run: npx lacspace-deps@0.2.0 . --fail-on duplicates
